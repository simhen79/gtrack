drills:

  # Off the Tee -------------------------------------------------------------------

  - id: 01M83KXB2W8P1DV7XXQPTS4K03
    name: Three-Tee Line
    category: off_the_tee
    facilities: [range_bay]
    features: []
    balls: 10
    estimatedMinutes: null
    secondsPerBall: null
    setup: "Tee the ball as normal, then push two more tees into the ground just ahead of it on the target line. Swing the driver through all three, so the club travels level through the strike rather than up."
    source: { concept: "Tees on the target line in front of the ball for a flatter path.", url: "https://golf.com/instruction/driving/simple-drill-solid-center-face-strikes/" }

  - id: 01M83KXB2YS2459Z45AFRRW012
    name: Face Strike Check
    category: off_the_tee
    facilities: [range_bay]
    features: []
    balls: 10
    estimatedMinutes: null
    secondsPerBall: null
    setup: "Spray the driver face with foot powder, or mark the ball with a dry-wipe pen, so each strike leaves a mark. Hit five balls to see your usual strike, then five aiming for the centre of the face."
    source: { concept: "Mark the face to see the strike, then move it on purpose.", url: "https://practical-golf.com/golf-drills" }

  # Approach ----------------------------------------------------------------------

  - id: 01M83KXB31CD2FEFDP4417Q9GN
    name: Short, Middle, Long
    category: approach
    facilities: [range_bay]
    features: [target_flags]
    distanceGroups: ["50-100", "100-150", "150+"]
    balls: 9
    estimatedMinutes: null
    secondsPerBall: null
    setup: "Pick a flag and hit your usual club at it. Then hit the next longer club at a spot 10 m beyond it, and the next shorter club at a spot 10 m short, on the same line. Go round three times."
    source: { concept: "Three neighbouring clubs at three distances on one line.", url: "https://www.golflink.com/instruction/best-range-games" }

  - id: 01M83KXB336PAHYB484KJPTWBD
    name: Random Club
    category: approach
    facilities: [range_bay]
    features: []
    distanceGroups: ["50-100", "100-150", "150+"]
    balls: 10
    estimatedMinutes: null
    secondsPerBall: null
    setup: "Before each ball, pick a club without planning it, then choose a target that suits it. Go through your full routine for every shot, as on the course."
    source: { concept: "Choose the club unpredictably, then a target to suit it.", url: "https://golf.com/instruction/10-proven-ways-make-range-practice-stick/" }

  - id: 01M83KXB363DXY10C0FKW5EMA5
    name: Wedge Clock
    category: approach
    facilities: [range_bay]
    features: [distance_signs]
    distanceGroups: ["50-100"]
    balls: 15
    estimatedMinutes: null
    secondsPerBall: null
    setup: "With one wedge, hit five balls each with a half, a three-quarter and a full swing. Note where each group lands against the range signs, so you know the wedge's three numbers."
    source: { concept: "Learn a wedge's carry for each length of swing.", url: "https://golf.com/instruction/dustin-johnson-wedge-combine-drill-learned/" }

  # Short Game --------------------------------------------------------------------

  - id: 01M83KXB391HYK2QJQH11ZDYEY
    name: Headcover Behind
    category: short_game
    facilities: [chipping_area]
    features: []
    balls: 10
    estimatedMinutes: null
    secondsPerBall: 30
    setup: "Lay an empty headcover on the grass about a club-head's length behind the ball. Chip without touching it, so the club meets the ball before the ground."
    source: { concept: "An object behind the ball to stop heavy chips.", url: "https://practical-golf.com/chipping-drills" }

  - id: 01M83KXB3BTHWDEVBXYTSWKAN8
    name: Stick Along the Shaft
    category: short_game
    facilities: [chipping_area]
    features: []
    balls: 10
    estimatedMinutes: null
    secondsPerBall: 30
    setup: "Hold an alignment stick against the grip so it runs up past your lead side. Make small chipping swings without the stick touching your body, then hit balls with it, then hit balls without it."
    source: { concept: "A stick along the shaft to stop the wrists flipping.", url: "https://practical-golf.com/chipping-drills" }

  - id: 01M83KXB3D172B1424H60ESP2D
    name: Line in the Sand
    category: short_game
    facilities: [practice_bunker]
    features: []
    balls: 10
    estimatedMinutes: null
    secondsPerBall: null
    setup: "Draw a line in the sand across your stance. Make swings that enter the sand on the line, then put a ball just ahead of the line and splash it out the same way."
    source: { concept: "A line in the sand to train where the club enters.", url: "https://golfmonthly.com/tips/banish-bad-bunker-shots-with-these-3-expert-drills" }

  # Putting -----------------------------------------------------------------------

  - id: 01M83KXB3G775RBKV291NRQKHN
    name: Putter Gate
    category: putting
    facilities: [putting_green]
    features: []
    distanceGroups: ["0-1", "1-3"]
    balls: 20
    estimatedMinutes: null
    secondsPerBall: null
    setup: "Push a tee into the green either side of the putter head, with just room for it to pass. Putt from 1 to 2 m without touching either tee."
    source: { concept: "A gate of tees round the putter head for a square strike.", url: "https://practical-golf.com/putting-drills-guide" }

  - id: 01M83KXB3JZCP8TRQM4QSC519J
    name: Halfway Gate
    category: putting
    facilities: [putting_green]
    features: []
    distanceGroups: ["1-3", "3-5"]
    balls: 10
    estimatedMinutes: null
    secondsPerBall: null
    setup: "Pick a fairly straight putt of 2.5 to 4 m. Halfway to the hole, push two tees into the green just wider than a ball apart. Roll each putt through the gate."
    source: { concept: "A narrow gate partway to the hole for start line.", url: "https://www.golflink.com/instruction/best-putting-games" }

  - id: 01M83KXB3MTHNY423Y8B5KNQHK
    name: Distance Ladder
    category: putting
    facilities: [putting_green]
    features: []
    distanceGroups: ["1-3", "3-5", "5+"]
    balls: 12
    estimatedMinutes: null
    secondsPerBall: null
    setup: "Put balls 1.5, 3, 4.5 and 6 m from a hole on one line. Putt each so it stops in the 30 cm past the hole. Go up the ladder three times."
    source: { concept: "Putts from rising distances, each stopping just past the hole.", url: "https://www.pga.com/story/nine-ways-to-play-better-golf-tee-to-green" }
