# The v1 Catalogue: 30 Games and 11 Drills, in the Catalogue content format.
#
# Reviewed here, in a PR, then loaded by the first-load import: Games as Drafts that
# pass the publish check on Approve, Drills straight into the Catalogue.
#
# - Distances are metres. Level 1 is the easiest, Level 5 the hardest.
# - Level 3 is written for a 5.4 Handicap Index. The up target is a score reached about
#   half the time at a comfortable Level, and the down target one fallen to about one
#   attempt in five. Both are estimates to tune in play.
# - Names, wording and tables are our own. `source` credits the concept a Game or Drill
#   grew from (research/range-games-catalogue.md); original Games have no link.

