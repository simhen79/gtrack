# Local development only: catches the app's email so sign-in codes and invites
# land in an inbox at http://localhost:8025.
# The ports come from api/.env (MAILPIT_SMTP_PORT, MAILPIT_UI_PORT), which Compose reads too,
# so a machine where another Mailpit holds 1025 or 8025 changes them in one place.
name: gtrack
services:
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025 # SMTP
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025 # web inbox
