name: api

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: gtrack_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress
      - run: npm ci && npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Requests during the upload get a clean 503 instead of mixed old and new
      # files. If any later step fails, the site stays down until a deploy succeeds.
      - name: Enter maintenance mode
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && php artisan down --retry=15"

      # .env, storage and the bootstrap cache belong to the server: they are
      # excluded, so --delete leaves them alone too.
      - name: Upload the build
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude=/.env \
            --exclude=/storage/ \
            --exclude=/bootstrap/cache/ \
            --exclude=/node_modules/ \
            --exclude=/tests/ \
            --exclude=/public/hot \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      # Every bootstrap cache file is deleted before migrating. The cache isn't
      # uploaded, so the server's copies come from the previous build: a stale
      # config cache hides new config files from migrations, and a stale package
      # manifest lists old packages. optimize rebuilds them all after migrating.
      # queue:restart lets each worker finish its current job before exiting.
      - name: Migrate, optimize, restart workers and go live
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" bash -se <<SCRIPT
          set -euo pipefail
          cd "$DEPLOY_PATH"
          rm -f bootstrap/cache/*.php
          php artisan package:discover
          php artisan migrate --force
          php artisan optimize
          php artisan queue:restart
          php artisan up
          SCRIPT
