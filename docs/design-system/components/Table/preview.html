<!-- @dsCard group="Data display" height=260 subtitle="HeroUI Table (web) · ListGroup (phone)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div class="gt-pad" id="root"></div>
<script>

var rows=[["14 Nov","Pebble Ridge",84,[0.12,-2.85,-1.10,0.48]],["08 Nov","Riverside",81,[-0.55,-1.20,-0.40,0.90]],["01 Nov","Pebble Ridge",86,[-0.90,-2.60,-1.35,-0.15]]];
function f(n){if(Math.abs(n)<0.005)return["0.00","sg-zero"];return[(n>0?"+":"−")+Math.abs(n).toFixed(2),n>0?"sg-pos":"sg-neg"];}
var g="display:grid;grid-template-columns:64px minmax(0,1fr) 56px repeat(4,62px) 72px;gap:10px;align-items:center;padding:10px 14px;font-size:14px;text-align:right";
var h='<div class="gt-card" style="padding:18px"><div class="gt-small" style="'+g+';font-weight:700"><span style="text-align:left">Date</span><span style="text-align:left">Course</span><span>Score</span><span>OTT</span><span>APP</span><span>SHG</span><span>PUT</span><span>Total</span></div>';
rows.forEach(function(r){var t=r[3].reduce(function(a,b){return a+b},0);h+='<a href="#" class="gt-num" style="'+g+';background:var(--surface-secondary);border-radius:14px;margin-top:6px;color:var(--foreground);text-decoration:none;font-weight:600"><span style="text-align:left;color:var(--muted)">'+r[0]+'</span><span style="text-align:left;font-weight:800">'+r[1]+'</span><span style="height:28px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--border);display:flex;align-items:center;justify-content:center;font-weight:800">'+r[2]+'</span>';r[3].forEach(function(v){var x=f(v);h+='<span class="'+x[1]+'">'+x[0]+'</span>';});var x=f(t);h+='<span class="'+x[1]+'" style="font-weight:800;font-size:15px">'+x[0]+'</span></a>';});
document.getElementById("root").innerHTML=h+'</div>';
</script>
</body>
</html>
