<!-- @dsCard group="gtrack patterns" height=190 subtitle="Weekly Plan: seven-day strip" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div class="gt-pad" id="root" style="max-width:720px"></div>
<script>

var d=[["Tue","17","60m",1,1],["Wed","18","",0,0],["Thu","19","45m",1,0],["Fri","20","",0,0],["Sat","21","90m",1,0],["Sun","22","",0,0],["Mon","23","",0,0]];
var h='<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px" role="group" aria-label="Weekly Plan">';
d.forEach(function(x){var s="min-height:86px;border-radius:18px;border:0;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;";s+=x[4]?"background:var(--highlight);color:var(--highlight-foreground)":x[3]?"background:var(--surface-tertiary);color:var(--foreground)":"background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--border)";h+='<button aria-pressed="'+(x[4]?"true":"false")+'" style="'+s+'"><span style="font-size:12px;font-weight:700">'+x[0]+'</span><span class="gt-num" style="font-size:22px">'+x[1]+'</span><span style="font-size:12px;font-weight:700">'+(x[2]||"Rest")+'</span></button>';});
document.getElementById("root").innerHTML=h+'</div>';
</script>
</body>
</html>
