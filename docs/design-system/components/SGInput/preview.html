<!-- @dsCard group="Forms" height=250 subtitle="InputGroup + Button: signed Strokes Gained entry" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div class="gt-pad" style="max-width:640px" id="root"></div>
<script>

var rows=[["ott","OTT","Off the Tee","+0.12"],["app","APP","Approach","-2.85"],["shg","SHG","Short Game","-1.10"],["put","PUT","Putting","+0.48"]];
var focus="app";
function fmt(v){var n=parseFloat(String(v).replace("−","-").replace("+",""));if(isNaN(n))return{t:v,c:""};if(Math.abs(n)<0.005)return{t:"0.00",c:"sg-zero"};return{t:(n>0?"+":"−")+Math.abs(n).toFixed(2),c:n>0?"sg-pos":"sg-neg"};}
function render(){var r=document.getElementById("root");r.innerHTML="";rows.forEach(function(x){var f=fmt(x[3]);var d=document.createElement("div");d.className="gt-tile";d.style.cssText="display:flex;align-items:center;gap:14px;padding:8px 8px 8px 16px;border-radius:16px;"+(focus===x[0]?"box-shadow:inset 0 0 0 2px var(--highlight)":"");d.innerHTML='<span class="gt-cat gt-cat--'+x[0]+'">'+x[1]+'</span><span style="flex:1;font-weight:600">'+x[2]+'</span><button class="gt-btn gt-btn--ghost gt-btn--icon" style="width:48px;height:48px;font-size:22px" aria-label="Flip sign">±</button><input class="gt-num '+f.c+'" inputmode="decimal" aria-label="'+x[2]+'" value="'+f.t+'" style="width:180px;height:56px;border-radius:12px;border:0;background:var(--background);text-align:right;padding:0 16px;font:inherit;font-size:28px;font-weight:800">';var b=d.querySelector("button"),i=d.querySelector("input");b.onclick=function(){x[3]=x[3].charAt(0)==="-"?"+"+x[3].slice(1):"-"+x[3].replace("+","");focus=x[0];render();};i.onchange=function(){x[3]=i.value.replace("−","-");render();};i.onfocus=function(){if(focus!==x[0]){focus=x[0];render();}};r.appendChild(d);});}
render();
</script>
</body>
</html>
