<!-- @dsCard group="Data display" height=250 subtitle="HeroUI Card · Surface · Separator" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div class="gt-pad"><div class="gt-row" style="align-items:stretch">
  <section class="gt-card" style="width:300px">
    <div class="gt-row" style="justify-content:space-between"><h3 class="gt-title">Last Practice Session</h3><button class="gt-more" aria-label="More">···</button></div>
    <div class="gt-row" style="gap:20px"><span><span class="gt-num" style="font-size:32px">75</span> <span class="gt-small">min</span></span><span><span class="gt-num" style="font-size:32px">7</span> <span class="gt-small">Session Items</span></span></div>
    <div class="gt-tile gt-row" style="justify-content:space-between"><span class="gt-row" style="gap:10px"><span class="gt-cat gt-cat--put">PUT</span><b style="font-size:14px">Three-foot circle</b></span><span class="gt-chip" style="background:var(--highlight);color:var(--highlight-foreground)">Level 3 → 4 ▲</span></div>
  </section>
  <section class="gt-card" style="width:220px">
    <span class="gt-small">Last Round · 14 Nov</span><span class="gt-num sg-neg" style="font-size:40px">−3.35</span><span style="font-weight:700">Pebble Ridge · 84</span>
  </section>
</div></div>
</body>
</html>
