<!-- @dsCard group="Feedback" height=230 subtitle="HeroUI Alert" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div class="gt-pad" style="max-width:640px">
  <div role="alert" class="gt-row" style="padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--warning) 14%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warning) 45%,transparent);color:var(--foreground);flex-wrap:nowrap;align-items:flex-start"><span style="color:var(--warning);display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v4M12 17.5v.5"/></svg></span><span style="font-size:14px">You changed the rules. Publishing creates v3; golfers' v2 scores stay, labelled "v2, replaced by v3".</span></div>
  <div role="alert" class="gt-row" style="padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--danger) 14%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 45%,transparent);flex-wrap:nowrap"><span style="color:var(--danger);display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 7.5v.5"/></svg></span><span style="flex:1;font-size:14px">No connection, so the Practice Session couldn't be generated.</span><button class="gt-btn gt-btn--white gt-btn--sm">Try again</button></div>
  <div class="gt-row" style="padding:12px 14px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--border);font-size:13px;color:var(--muted);flex-wrap:nowrap"><span style="display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 7.5v.5"/></svg></span>This month's suggestion limit is reached, so this session uses your usual picks without reasons.</div>
</div>
</body>
</html>
