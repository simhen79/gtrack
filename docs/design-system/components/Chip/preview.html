<!-- @dsCard group="Data display" height=200 subtitle="HeroUI Chip · Badge · Avatar · Kbd" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div class="gt-pad">
  <div class="gt-row"><span class="gt-cat gt-cat--ott">OTT</span><span class="gt-cat gt-cat--app">APP</span><span class="gt-cat gt-cat--shg">SHG</span><span class="gt-cat gt-cat--put">PUT</span></div>
  <div class="gt-row">
    <span class="gt-chip" style="background:var(--highlight);color:var(--highlight-foreground)">Level 3 → 4 ▲</span>
    <span class="gt-chip">Level 2, held</span>
    <span class="gt-chip" style="background:transparent;color:var(--sg-negative);box-shadow:inset 0 0 0 1.5px var(--sg-negative)">Level 3 → 2 ▼</span>
    <span class="gt-chip"><span style="width:8px;height:8px;border-radius:4px;background:var(--success)"></span>Published · v2, replaced v1 on 3 March</span>
    <span class="gt-chip">Picked for your 150 m+ Approach</span>
  </div>
  <div class="gt-row">
    <span style="position:relative;width:44px;height:44px;border-radius:22px;background:var(--highlight);color:var(--highlight-foreground);display:flex;align-items:center;justify-content:center;font-weight:800">SP<span style="position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:6px;background:var(--accent);box-shadow:0 0 0 2px var(--background)"></span></span>
    <span class="gt-small">Save Round <span class="gt-kbd">Ctrl</span> <span class="gt-kbd">S</span></span>
  </div>
</div>
</body>
</html>
