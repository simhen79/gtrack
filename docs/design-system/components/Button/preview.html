<!-- @dsCard group="Actions" height=200 subtitle="HeroUI Button · ButtonGroup · CloseButton" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div class="gt-pad">
  <div class="gt-row">
    <button class="gt-btn gt-btn--primary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Enter a Round</button>
    <button class="gt-btn gt-btn--secondary">Variations (3)</button>
    <button class="gt-btn gt-btn--ghost">Cancel</button>
    <button class="gt-btn gt-btn--danger">Delete Round</button>
    <button class="gt-btn gt-btn--primary" disabled>Save Round</button>
  </div>
  <div class="gt-row">
    <button class="gt-btn gt-btn--white" style="padding:0 6px 0 16px">Start it on your phone <span style="width:32px;height:32px;border-radius:8px;background:var(--background);color:var(--foreground);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></span></button>
    <button class="gt-btn gt-btn--ghost gt-btn--icon" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4"/></svg></button>
    <button class="gt-more" aria-label="More">···</button>
    <button class="gt-btn gt-btn--ghost gt-btn--icon gt-btn--sm" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <span class="gt-row" style="gap:8px"><button class="gt-btn gt-btn--ghost gt-btn--lg">Cancel</button><button class="gt-btn gt-btn--primary gt-btn--lg">Save Round</button></span>
  </div>
</div>
</body>
</html>
