<!-- @dsCard group="Forms" height=150 subtitle="HeroUI Slider: Unplanned Session minutes" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div class="gt-pad" style="max-width:520px">
  <div class="gt-row" style="justify-content:space-between"><span class="gt-label">Minutes</span><span class="gt-num" style="font-size:24px">60 <span class="gt-small">min</span></span></div>
  <div style="position:relative;height:28px"><div style="position:absolute;left:0;right:0;top:10px;height:8px;border-radius:4px;background:var(--surface-tertiary)"></div><div style="position:absolute;left:0;width:43%;top:10px;height:8px;border-radius:4px;background:var(--accent)"></div><div style="position:absolute;left:calc(43% - 14px);top:0;width:28px;height:28px;border-radius:14px;background:var(--foreground);box-shadow:0 0 0 4px var(--background)"></div></div>
  <div class="gt-row gt-small" style="justify-content:space-between"><span>15</span><span>120</span></div>
</div>
</body>
</html>
