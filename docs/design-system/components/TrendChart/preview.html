<!-- @dsCard group="gtrack patterns" height=290 subtitle="Recharts on web: SG Category trend" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div class="gt-pad" id="root" style="max-width:560px"></div>
<script>

var N=20,p5=[],p20=[];for(var i=0;i<N;i++){var a=-2.1-0.07*(19-i)+0.32*Math.sin(i*1.3),b=-2.1-0.049*(19-i)+0.12*Math.sin(i*0.45);var x=i/(N-1)*100;p5.push(x.toFixed(1)+","+((2-a)/6*160).toFixed(1));p20.push(x.toFixed(1)+","+((2-b)/6*160).toFixed(1));}
var last=p5[N-1].split(",");
document.getElementById("root").innerHTML='<div class="gt-card"><div class="gt-row"><span class="gt-cat gt-cat--app">APP</span><b style="flex:1;font-size:18px">Approach</b><span class="gt-chip">14 Nov</span></div><div class="gt-row" style="gap:24px;align-items:baseline"><span><span class="gt-small" style="display:block">Last 5</span><span class="gt-num sg-neg" style="font-size:32px">−2.10</span></span><span><span class="gt-small" style="display:block">Last 20</span><span class="gt-num sg-neg" style="font-size:20px">−1.84</span></span></div><div style="position:relative;height:160px"><div style="position:absolute;left:0;right:0;top:53px;border-top:1.5px solid var(--muted)"></div><div style="position:absolute;left:0;right:0;top:107px;border-top:1px dashed var(--separator)"></div><svg viewBox="0 0 100 160" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:160px;overflow:visible" role="img" aria-label="Approach Strokes Gained trend"><polyline points="'+p20.join(" ")+'" fill="none" stroke="var(--chart-bar)" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/><polyline points="'+p5.join(" ")+'" fill="none" stroke="var(--cat-app)" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><span style="position:absolute;right:-7px;top:'+(last[1]-7)+'px;width:14px;height:14px;border-radius:7px;background:var(--cat-app);box-shadow:0 0 0 3px var(--surface)"></span></div></div>';
</script>
</body>
</html>
