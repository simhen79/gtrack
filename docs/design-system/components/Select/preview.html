<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div class="gt-pad" style="max-width:360px">
  <label class="gt-fieldwrap"><span class="gt-label">Baseline</span><span class="gt-field" style="justify-content:space-between">Scratch <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></label>
  <div class="gt-overlay" role="listbox" style="padding:6px;border-radius:18px">
    <div role="option" style="height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:12px;font-weight:600">Tour</div>
    <div role="option" aria-selected="true" style="height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:12px;background:var(--surface-tertiary);font-weight:800">Scratch <span style="width:8px;height:8px;border-radius:4px;background:var(--highlight)"></span></div>
    <div role="option" style="height:40px;display:flex;align-items:center;padding:0 12px;border-radius:12px;font-weight:600">10 handicap</div>
  </div>
</div>
</body>
</html>
