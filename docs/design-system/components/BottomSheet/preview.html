<!-- @dsCard group="Overlays" height=330 subtitle="HeroUI Native BottomSheet · HeroUI Sheet / Drawer (web)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div data-theme="range" style="background:var(--background);color:var(--foreground);padding:20px 0 0;width:390px;height:330px;display:flex;flex-direction:column;justify-content:flex-end">
  <div role="dialog" aria-labelledby="rt" style="background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px 28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 1px var(--border)">
    <span style="align-self:center;width:44px;height:5px;border-radius:3px;background:var(--border)"></span>
    <h3 id="rt" style="margin:0;font-size:26px;font-weight:800">Fairway corridor · rules</h3>
    <p style="margin:0;font-size:18px;line-height:1.5">Pick two targets 30 m apart at about 220 m. Hit 12 drives. A ball between the targets is a hit.</p>
    <button class="gt-btn" style="height:64px;border-radius:14px;background:var(--accent);color:var(--accent-foreground);font-size:20px;font-weight:800">Back to scoring</button>
  </div></div>
</body>
</html>
