<!-- @dsCard group="Forms" height=170 subtitle="HeroUI InputOTP: 6-digit sign-in code" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div class="gt-pad">
  <span class="gt-label">Code from your email</span>
  <div class="gt-row" style="gap:8px">
    <span class="gt-field gt-num" style="width:52px;height:60px;justify-content:center;font-size:24px;padding:0">4</span>
    <span class="gt-field gt-num" style="width:52px;height:60px;justify-content:center;font-size:24px;padding:0">0</span>
    <span class="gt-field gt-num" style="width:52px;height:60px;justify-content:center;font-size:24px;padding:0">8</span>
    <span class="gt-field gt-num" style="width:52px;height:60px;justify-content:center;font-size:24px;padding:0;border:2px solid var(--focus)">|</span>
    <span class="gt-field" style="width:52px;height:60px;padding:0"></span>
    <span class="gt-field" style="width:52px;height:60px;padding:0"></span>
  </div>
  <span class="gt-small">Didn't get it? Check spam, or <a href="#" style="color:var(--link)">send a new code</a>.</span>
</div>
</body>
</html>
