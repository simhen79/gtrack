<!-- @dsCard group="gtrack patterns" height=140 subtitle="Chip: connection status in a live session" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<div data-theme="range" style="background:var(--background);color:var(--foreground);padding:20px;display:flex;gap:10px;flex-wrap:wrap">
  <span style="display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;border:1.5px solid var(--success);font-size:14px;font-weight:700"><span style="width:10px;height:10px;border-radius:5px;background:var(--success)"></span>Online</span>
  <span style="display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;border:1.5px dashed var(--warning);font-size:14px;font-weight:700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l16 16M8.5 16.5a5 5 0 0 1 7 0M12 20h.01"/></svg>Offline · 3 scores saved</span>
  <span style="display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;border:1.5px solid var(--foreground);font-size:14px;font-weight:700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>Uploading 2 of 5</span>
</div>
</body>
</html>
